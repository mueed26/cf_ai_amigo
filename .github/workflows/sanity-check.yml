# CI/CD: check every push and pull request, then deploy main to Cloudflare.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    # Only after the checks pass, and only for pushes to main (not pull requests).
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip if Cloudflare secrets are not set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable auto-deploy."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      # Same command as deploying from your machine: build, then wrangler deploy.
      # Secrets (Clerk, Google) are already stored on the Worker and aren't touched.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy

      - name: Check the live site is healthy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          curl --fail --silent --show-error https://cf-ai-amigo.mirmueed000.workers.dev/api/health
